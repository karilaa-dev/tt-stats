name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tt_stats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUN_DATABASE_INTEGRATION: "1"
      TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/tt_stats_test
      DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/tt_stats_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun --bun playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:browser
      - run: bun run build
      - run: bun scripts/check-production-proxy.mjs

  deployment-build:
    runs-on: ubuntu-latest
    env:
      RAILPACK_VERSION: "0.15.4"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Install the Railpack version used by Dokploy
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/railwayapp/railpack/releases/download/v${RAILPACK_VERSION}/railpack-v${RAILPACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/railpack.tar.gz"
          mkdir -p "$RUNNER_TEMP/railpack-bin"
          tar -xzf "$RUNNER_TEMP/railpack.tar.gz" -C "$RUNNER_TEMP/railpack-bin"
          echo "$RUNNER_TEMP/railpack-bin" >> "$GITHUB_PATH"
      - name: Build the deployment image without production secrets
        run: |
          railpack prepare . --plan-out "$RUNNER_TEMP/railpack-plan.json"
          docker buildx build \
            --build-arg "BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend:v${RAILPACK_VERSION}" \
            --file "$RUNNER_TEMP/railpack-plan.json" \
            --output type=docker,name=tt-stats:ci .
